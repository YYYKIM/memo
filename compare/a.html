<head>

<title>Home</title>

<style>
  :root {
    --color-primary: #3182f6;
    --surface-page: #f2f4f6;
    --surface-card: #ffffff;
    --text-primary: #191f28;
    --text-secondary: #4e5968;
    --text-muted: #8b95a1;
    --text-on-primary: #ffffff;
    --label-blue-soft: #e8f3ff;
    --label-green-soft: #e3f8ec;
    --label-orange-soft: #fff1e5;
    --label-pink-soft: #ffeaf1;
    --space-4: 4px; --space-8: 8px; --space-12: 12px; --space-16: 16px;
    --space-20: 20px; --space-24: 24px; --space-34: 34px; --space-64: 64px;
    --radius-sm: 12px; --radius-md: 16px; --radius-xl: 24px; --radius-full: 999px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--surface-page);
    font-family: "Noto Sans KR", system-ui, sans-serif;
    color: var(--text-primary);
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }
  .home {
    width: 100%;
    max-width: 390px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: var(--space-16);
    padding: var(--space-64) var(--space-16) var(--space-34);
  }
  .main { flex: 1; display: flex; flex-direction: column; gap: var(--space-16); }

  .header { display: flex; flex-direction: column; gap: var(--space-8); padding: 0 var(--space-8); }
  .date { font-size: 15px; line-height: 22px; font-weight: 500; letter-spacing: -0.2px; color: var(--text-muted); }
  .heading { font-size: 28px; line-height: 38px; font-weight: 700; letter-spacing: -0.8px; }
  .heading em { font-style: normal; color: var(--color-primary); }

  .filter { display: flex; gap: var(--space-8); padding: 0 var(--space-4); overflow-x: auto; scrollbar-width: none; }
  .filter::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; height: 36px; padding: 0 var(--space-16);
    border: 0; border-radius: var(--radius-full);
    background: var(--surface-card); color: var(--text-secondary);
    font: 700 15px/22px "Noto Sans KR", sans-serif; letter-spacing: -0.2px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--color-primary); color: var(--text-on-primary); }

  .card { background: var(--surface-card); border-radius: var(--radius-xl); padding: var(--space-8) 0; }
  .card-header {
    display: flex; align-items: center; gap: var(--space-4); height: 40px;
    padding: var(--space-12) var(--space-16) var(--space-4) var(--space-20);
  }
  .card-header h2 { flex: 1; min-width: 0; font-size: 15px; line-height: 22px; font-weight: 700; letter-spacing: -0.2px; }
  .card-header img { width: 16px; height: 16px; display: block; }
  .link {
    display: flex; align-items: center; gap: var(--space-4);
    background: none; border: 0; cursor: pointer;
    font: 500 15px/22px "Noto Sans KR", sans-serif; letter-spacing: -0.2px; color: var(--text-muted);
  }

  .memo {
    display: flex; align-items: center; gap: var(--space-16); height: 72px;
    padding: var(--space-12) var(--space-20);
    color: inherit; text-decoration: none;
  }
  .tile { flex: none; width: 44px; height: 44px; border-radius: var(--radius-sm); display: grid; place-items: center; }
  .tile img { width: 22px; height: 22px; display: block; }
  .tile.blue { background: var(--label-blue-soft); }
  .tile.green { background: var(--label-green-soft); }
  .tile.orange { background: var(--label-orange-soft); }
  .tile.pink { background: var(--label-pink-soft); }
  .memo-content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-4); }
  .memo-title { font-size: 17px; line-height: 24px; font-weight: 700; letter-spacing: -0.3px; color: var(--text-primary); }
  .memo-preview {
    font-size: 14px; line-height: 20px; font-weight: 400; letter-spacing: -0.1px; color: var(--text-secondary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .memo-date { flex: none; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--text-muted); white-space: nowrap; }

  .btn-primary {
    position: sticky; bottom: var(--space-34);
    display: flex; align-items: center; justify-content: center; gap: var(--space-8);
    width: 100%; height: 56px; padding: 0 var(--space-24);
    border: 0; border-radius: var(--radius-md);
    background: var(--color-primary); color: var(--text-on-primary);
    font: 700 17px/24px "Noto Sans KR", sans-serif; letter-spacing: -0.2px; cursor: pointer;
  }
  .btn-primary img { width: 20px; height: 20px; display: block; }
</style>
</head>
